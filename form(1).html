<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Form Konsultasi — Saulina AI</title>
  <meta name="description" content="Form konsultasi Saulina AI." />
  <link rel="icon" type="image/png" href="assets/img/Logo.jpg" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <style>
    :root {
      --brand: #6d28d9;
      --brand-dark: #4c1d95;
      --text-secondary-accessible: #5c636a;
    }
    body { background: #f7f5fb; }
    .btn-brand { background: var(--brand); color: #fff; }
    .btn-brand:hover { background: var(--brand-dark); color: #fff; }
    .text-secondary { color: var(--text-secondary-accessible) !important; }
  </style>
</head>
<body>
  <nav class="navbar navbar-dark bg-dark">
    <div class="container py-2">
      <a class="navbar-brand fw-bold" href="index.html">Saulina<span class="text-info">.AI</span></a>
      <a class="btn btn-outline-light btn-sm" href="index.html">Kembali ke Beranda</a>
    </div>
  </nav>

  <main class="py-5">
    <div class="container" style="max-width: 760px;">
      <div class="bg-white p-4 p-md-5 rounded-4 shadow-sm">
        <h1 class="fw-bold mb-2">Form Konsultasi</h1>
        <p class="text-secondary mb-4">
          Isi form berikut untuk menyampaikan kebutuhan AI Anda.
        </p>

        <form action="#" method="get">
          <div class="mb-3">
            <label for="name" class="form-label fw-semibold">Nama</label>
            <input id="name" name="name" type="text" class="form-control"
                   placeholder="Nama Anda" required />
          </div>

          <div class="mb-3">
            <label for="email" class="form-label fw-semibold">Email</label>
            <input id="email" name="email" type="email" class="form-control"
                   placeholder="nama@perusahaan.com" required />
          </div>

          <div class="mb-3">
            <label for="service" class="form-label fw-semibold">Fokus Layanan</label>
            <select id="service" name="service" class="form-select">
              <option value="chatbot">Chatbot &amp; Asisten Virtual</option>
              <option value="automasi">Automasi Alur Kerja</option>
              <option value="vision">Computer Vision</option>
              <option value="prediktif">Analitik Prediktif</option>
            </select>
          </div>

          <div class="mb-4">
            <label for="message" class="form-label fw-semibold">Ceritakan Kebutuhan Anda</label>
            <textarea id="message" name="message" rows="5" class="form-control"
                      placeholder="Contoh: kami ingin automasi tiket layanan pelanggan..."></textarea>
          </div>

          <button type="submit" class="btn btn-brand px-4 rounded-pill">
            Kirim Permintaan Konsultasi
          </button>
        </form>
      </div>
    </div>
  </main>

  <footer class="bg-dark text-white py-4 mt-5 text-center small">
    <div class="container">
      <p class="mb-0">&copy; 2026 Saulina AI &bull; Praktikum PABWE</p>
    </div>
  </footer>
</body>
</html>
